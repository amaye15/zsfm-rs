name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zsfm-rs

      - name: Set up Python 3.12 (for zsfm-python pyo3)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: cargo build --release
        working-directory: zsfm-rs
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: cargo build --release --workspace --exclude zsfm-python

      - name: cargo test --release
        working-directory: zsfm-rs
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: cargo test --release --workspace --exclude zsfm-python
