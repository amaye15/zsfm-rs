name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zsfm-rs

      - name: cargo doc (workspace, no external deps)
        working-directory: zsfm-rs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps

      - name: Install mdBook
        run: curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz | tar xz

      - name: mdbook build (usage guide)
        working-directory: docs-guide
        run: ../mdbook build

      - name: Assemble Pages site
        run: |
          rm -rf site
          mkdir -p site
          cp .github/pages/index.html site/index.html
          mkdir -p site/api
          cp -r zsfm-rs/target/doc/. site/api/
          cp .github/pages/api-index.html site/api/index.html
          cp -r docs-guide/book site/guide

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
