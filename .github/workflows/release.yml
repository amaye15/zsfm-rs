name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-binaries:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
        # macos-13 (x86_64-apple-darwin) was dropped: GitHub's free Intel Mac
        # runner pool has effectively no capacity left — a build queued for
        # 10+ hours without starting. Intel Mac users can still build from
        # source (`cargo build --release -p zsfm-cli` in zsfm-rs). Re-add if
        # GitHub restores capacity or a self-hosted Intel runner becomes
        # available.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zsfm-rs

      - name: cargo build --release -p zsfm-cli
        working-directory: zsfm-rs
        run: cargo build --release -p zsfm-cli

      - name: Package
        working-directory: zsfm-rs
        run: |
          pkg="zsfm-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$pkg"
          cp target/release/zsfm "$pkg"/
          cp ../LICENSE "$pkg"/ 2>/dev/null || true
          tar czf "$pkg.tar.gz" "$pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: zsfm-${{ matrix.target }}
          path: zsfm-rs/zsfm-*-${{ matrix.target }}.tar.gz

  github-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release + upload binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/*.tar.gz \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes

  publish-crates:
    name: Publish to crates.io
    needs: build-binaries
    runs-on: ubuntu-latest
    # Skips cleanly (rather than failing) if CRATES_IO_TOKEN hasn't been added
    # yet under Settings -> Secrets and variables -> Actions.
    if: ${{ vars.PUBLISH_CRATES_IO == 'true' && github.repository_owner == 'amaye15' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zsfm-rs

      - name: Publish crates in dependency order
        working-directory: zsfm-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: ./scripts/publish-crates.sh
