[workspace]
resolver = "2"
members = [
    "zsfm-rs/crates/zsfm-gguf",
    "zsfm-rs/crates/zsfm-hub",
    "zsfm-rs/crates/zsfm-core",
    "zsfm-rs/crates/zsfm-nn",
    "zsfm-rs/crates/zsfm-checkpoint",
    "zsfm-rs/crates/models/toto",
    "zsfm-rs/crates/models/tabfm",
    "zsfm-rs/crates/models/mitra",
    "zsfm-rs/crates/models/tabdpt",
    "zsfm-rs/crates/models/tabicl",
    "zsfm-rs/crates/models/tabpfn",
    "zsfm-rs/crates/models/chronos",
    "zsfm-rs/crates/models/timesfm",
    "zsfm-rs/crates/models/sundial",
    "zsfm-rs/crates/models/ttm",
    "zsfm-rs/crates/models/lag_llama",
    "zsfm-rs/crates/models/moment",
    "zsfm-rs/crates/models/moirai",
    "zsfm-rs/crates/models/moirai2",
    "zsfm-rs/crates/models/flowstate",
    "zsfm-rs/crates/models/tirex",
    "zsfm-rs/crates/zsfm",
    "zsfm-rs/crates/zsfm-python",
    "zsfm-rs/crates/zsfm-bench",
]

[workspace.package]
version = "0.2.7"
edition = "2021"
license = "MIT"
repository = "https://github.com/amaye15/zsfm-rs"

[workspace.dependencies]
# Internal crates (path + version, so `cargo publish` accepts them as real
# dependencies rather than dev-only path links). Keep this list's names/paths
# in sync with `members` above; version is inherited from [workspace.package].
zsfm-core = { path = "zsfm-rs/crates/zsfm-core", version = "0.2.7" }
zsfm-gguf = { path = "zsfm-rs/crates/zsfm-gguf", version = "0.2.7" }
zsfm-hub = { path = "zsfm-rs/crates/zsfm-hub", version = "0.2.7" }
zsfm-nn = { path = "zsfm-rs/crates/zsfm-nn", version = "0.2.7" }
zsfm-checkpoint = { path = "zsfm-rs/crates/zsfm-checkpoint", version = "0.2.7" }
zsfm-toto = { path = "zsfm-rs/crates/models/toto", version = "0.2.7" }
zsfm-tabfm = { path = "zsfm-rs/crates/models/tabfm", version = "0.2.7" }
zsfm-mitra = { path = "zsfm-rs/crates/models/mitra", version = "0.2.7" }
zsfm-tabdpt = { path = "zsfm-rs/crates/models/tabdpt", version = "0.2.7" }
zsfm-tabicl = { path = "zsfm-rs/crates/models/tabicl", version = "0.2.7" }
zsfm-tabpfn = { path = "zsfm-rs/crates/models/tabpfn", version = "0.2.7" }
zsfm-chronos = { path = "zsfm-rs/crates/models/chronos", version = "0.2.7" }
zsfm-timesfm = { path = "zsfm-rs/crates/models/timesfm", version = "0.2.7" }
zsfm-sundial = { path = "zsfm-rs/crates/models/sundial", version = "0.2.7" }
zsfm-ttm = { path = "zsfm-rs/crates/models/ttm", version = "0.2.7" }
zsfm-lag-llama = { path = "zsfm-rs/crates/models/lag_llama", version = "0.2.7" }
zsfm-moment = { path = "zsfm-rs/crates/models/moment", version = "0.2.7" }
zsfm-moirai = { path = "zsfm-rs/crates/models/moirai", version = "0.2.7" }
zsfm-moirai2 = { path = "zsfm-rs/crates/models/moirai2", version = "0.2.7" }
zsfm-flowstate = { path = "zsfm-rs/crates/models/flowstate", version = "0.2.7" }
zsfm-tirex = { path = "zsfm-rs/crates/models/tirex", version = "0.2.7" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
byteorder = "1"
reqwest = { version = "0.11", default-features = false, features = ["stream", "json", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
safetensors = "0.4"
indicatif = "0.17"
sha2 = "0.10"
base64 = "0.22"
candle-core = "0.8"
candle-nn = "0.8"
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"
ndarray = { version = "0.15", features = ["blas"] }

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = true
panic         = "abort"
