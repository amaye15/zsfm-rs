[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "lag-llama-rs"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24.4",
    "safetensors>=0.5.3",
    "torch>=2.5.1",
]

[tool.maturin]
features = ["python"]
module-name = "lag_llama_rs"

[dependency-groups]
dev = [
    "maturin>=1.14.0",
]
