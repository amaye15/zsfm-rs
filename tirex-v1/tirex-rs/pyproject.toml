[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "tirex-rs"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "tirex-ts",
]

[tool.maturin]
features = ["python"]
module-name = "tirex_rs"

[dependency-groups]
dev = [
    "maturin>=1.14.0",
    "numpy>=1.24.4",
]
