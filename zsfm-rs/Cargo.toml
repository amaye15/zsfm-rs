[workspace]
resolver = "2"
members = [
    "crates/zsfm-gguf",
    "crates/zsfm-hub",
    "crates/zsfm-core",
    "crates/zsfm-nn",
    "crates/zsfm-checkpoint",
    "crates/models/toto",
    "crates/models/tabfm",
    "crates/models/mitra",
    "crates/models/tabdpt",
    "crates/models/tabicl",
    "crates/models/tabpfn",
    "crates/models/chronos",
    "crates/models/timesfm",
    "crates/models/sundial",
    "crates/models/ttm",
    "crates/models/lag_llama",
    "crates/models/moment",
    "crates/models/moirai",
    "crates/models/moirai2",
    "crates/models/flowstate",
    "crates/models/tirex",
    "crates/zsfm-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
byteorder = "1"
reqwest = { version = "0.11", features = ["stream", "json"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
safetensors = "0.4"
indicatif = "0.17"
sha2 = "0.10"
base64 = "0.22"
candle-core = { version = "0.8", features = ["accelerate"] }
candle-nn = { version = "0.8", features = ["accelerate"] }

# Shared by every crate in the workspace so the 11 legacy per-model crates'
# copy-pasted [profile.release] blocks collapse to one definition.
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = true
panic         = "abort"
