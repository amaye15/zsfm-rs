[workspace]
resolver = "2"
members = [
    "crates/zsfm-gguf",
    "crates/zsfm-hub",
    "crates/zsfm-core",
    "crates/zsfm-nn",
    "crates/zsfm-checkpoint",
    "crates/models/toto",
    "crates/models/tabfm",
    "crates/models/mitra",
    "crates/models/tabdpt",
    "crates/models/tabicl",
    "crates/models/tabpfn",
    "crates/models/chronos",
    "crates/models/timesfm",
    "crates/models/sundial",
    "crates/models/ttm",
    "crates/models/lag_llama",
    "crates/models/moment",
    "crates/models/moirai",
    "crates/models/moirai2",
    "crates/models/flowstate",
    "crates/models/tirex",
    "crates/zsfm",
    "crates/zsfm-python",
    "crates/zsfm-bench",
]

[workspace.package]
version = "0.2.6"
edition = "2021"
license = "MIT"
repository = "https://github.com/amaye15/zsfm-rs"

[workspace.dependencies]
# Internal crates (path + version, so `cargo publish` accepts them as real
# dependencies rather than dev-only path links). Keep this list's names/paths
# in sync with `members` above; version is inherited from [workspace.package].
zsfm-core = { path = "crates/zsfm-core", version = "0.2.6" }
zsfm-gguf = { path = "crates/zsfm-gguf", version = "0.2.6" }
zsfm-hub = { path = "crates/zsfm-hub", version = "0.2.6" }
zsfm-nn = { path = "crates/zsfm-nn", version = "0.2.6" }
zsfm-checkpoint = { path = "crates/zsfm-checkpoint", version = "0.2.6" }
zsfm-toto = { path = "crates/models/toto", version = "0.2.6" }
zsfm-tabfm = { path = "crates/models/tabfm", version = "0.2.6" }
zsfm-mitra = { path = "crates/models/mitra", version = "0.2.6" }
zsfm-tabdpt = { path = "crates/models/tabdpt", version = "0.2.6" }
zsfm-tabicl = { path = "crates/models/tabicl", version = "0.2.6" }
zsfm-tabpfn = { path = "crates/models/tabpfn", version = "0.2.6" }
zsfm-chronos = { path = "crates/models/chronos", version = "0.2.6" }
zsfm-timesfm = { path = "crates/models/timesfm", version = "0.2.6" }
zsfm-sundial = { path = "crates/models/sundial", version = "0.2.6" }
zsfm-ttm = { path = "crates/models/ttm", version = "0.2.6" }
zsfm-lag-llama = { path = "crates/models/lag_llama", version = "0.2.6" }
zsfm-moment = { path = "crates/models/moment", version = "0.2.6" }
zsfm-moirai = { path = "crates/models/moirai", version = "0.2.6" }
zsfm-moirai2 = { path = "crates/models/moirai2", version = "0.2.6" }
zsfm-flowstate = { path = "crates/models/flowstate", version = "0.2.6" }
zsfm-tirex = { path = "crates/models/tirex", version = "0.2.6" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
byteorder = "1"
reqwest = { version = "0.11", default-features = false, features = ["stream", "json", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
safetensors = "0.4"
indicatif = "0.17"
sha2 = "0.10"
base64 = "0.22"
# No "accelerate" feature here: it links Apple's Accelerate.framework and only
# builds on macOS. `zsfm` (crates/zsfm) turns it on for macOS builds only (see
# its Cargo.toml) via Cargo's feature unification, which every other crate in
# the workspace picks up for free when built as part of the `zsfm` binary;
# standalone `cargo test -p <model-crate>` runs still work everywhere via
# candle's portable default backend.
candle-core = "0.8"
candle-nn = "0.8"
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"
ndarray = { version = "0.15", features = ["blas"] }

# Shared by every crate in the workspace so the 11 legacy per-model crates'
# copy-pasted [profile.release] blocks collapse to one definition.
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = true
panic         = "abort"
