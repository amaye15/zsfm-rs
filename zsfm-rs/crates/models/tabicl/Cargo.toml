[package]
name = "zsfm-tabicl"
version.workspace = true
edition.workspace = true
description = "TabICL (jingang/TabICL, v2) zero-shot tabular foundation model: GGUF conversion + candle in-context-learning inference (classification only; regression's quantile-distribution head and >10-class mixed-radix ensembling are out of scope)."

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
safetensors.workspace = true
byteorder.workspace = true
indicatif.workspace = true
candle-core.workspace = true
candle-nn.workspace = true
zsfm-core = { path = "../../zsfm-core" }
zsfm-nn = { path = "../../zsfm-nn" }
zsfm-gguf = { path = "../../zsfm-gguf" }
zsfm-hub = { path = "../../zsfm-hub" }

[lib]
path = "src/lib.rs"
