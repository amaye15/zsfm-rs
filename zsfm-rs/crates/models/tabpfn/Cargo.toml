[package]
name = "zsfm-tabpfn"
version.workspace = true
edition.workspace = true
description = "TabPFN-3 (Prior-Labs/tabpfn_3) zero-shot tabular foundation model: GGUF conversion + candle in-context-learning inference (classification only; regression's bar-distribution head is out of scope). NON-COMMERCIAL WEIGHTS LICENSE: research/internal-use only, see the crate's module docs."

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
safetensors.workspace = true
byteorder.workspace = true
indicatif.workspace = true
candle-core.workspace = true
candle-nn.workspace = true
zsfm-core = { path = "../../zsfm-core" }
zsfm-nn = { path = "../../zsfm-nn" }
zsfm-gguf = { path = "../../zsfm-gguf" }
zsfm-hub = { path = "../../zsfm-hub" }

[lib]
path = "src/lib.rs"
