[package]
name = "zsfm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Single CLI (convert / infer / upload) for every zsfm model, replacing the 11 per-model binaries."

[[bin]]
name = "zsfm"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
safetensors.workspace = true
candle-core.workspace = true
zsfm-core.workspace = true
zsfm-gguf.workspace = true
zsfm-hub.workspace = true
zsfm-checkpoint.workspace = true
zsfm-toto.workspace = true
zsfm-tabfm.workspace = true
zsfm-mitra.workspace = true
zsfm-tabdpt.workspace = true
zsfm-tabicl.workspace = true
zsfm-tabpfn.workspace = true
zsfm-chronos.workspace = true
zsfm-timesfm.workspace = true
zsfm-sundial.workspace = true
zsfm-ttm.workspace = true
zsfm-lag-llama.workspace = true
zsfm-moment.workspace = true
zsfm-moirai.workspace = true
zsfm-moirai2.workspace = true
zsfm-flowstate.workspace = true
zsfm-tirex.workspace = true

# Apple's Accelerate framework only exists on macOS; enabling it here (the final
# binary crate) turns it on workspace-wide via Cargo feature unification for
# macOS builds, while Linux/Windows builds fall back to candle's portable
# default backend without needing per-crate conditionals everywhere else.
[target.'cfg(target_os = "macos")'.dependencies]
candle-nn = { workspace = true, features = ["accelerate"] }

[target.'cfg(target_os = "macos")'.dependencies.candle-core]
workspace = true
features = ["accelerate"]
